<!DOCTYPE html>
<html lang="ja">
<head>

    <title>自己紹介2</title>

            line-height: 1.6;

            display: block;
        }
        .section {
            margin-bottom: 20px;
        }
        ul {
            list-style-type: none;
            padding-left: 0;
        }
        ul li:before {

            font-weight: bold;
            margin-right: 10px;
        }
        .contact {
            background-color: #f9f9f9;
